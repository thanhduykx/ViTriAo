name: ViTriAo
options:
  bundleIdPrefix: com.vitriao
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  ViTriAo:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Vị Trí Ảo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: Dùng để hiển thị vị trí iPhone đang báo và giữ phiên giả lập.
        NSLocationAlwaysAndWhenInUseUsageDescription: Cho phép "Luôn luôn" để app chạy nền và giữ vị trí ảo khi bạn mở app khác.
        NSLocalNetworkUsageDescription: Kết nối tới chính iPhone qua VPN loopback để đặt vị trí ảo.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitriao.app
        PRODUCT_NAME: ViTriAo
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: iphoneos
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/core/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/core/target/aarch64-apple-ios/release
        OTHER_LDFLAGS: [-llocsim_core]
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreLocation.framework
      - sdk: MapKit.framework
    scheme: {}
